# Staging deployment — a second Presio app container built from the working
# tree, routed by the shared Traefik proxy at ${STAGING_HOST}. It talks to its
# OWN Supabase/Postgres (docker-compose.staging-supabase.yml), not prod's — an
# --env-file pointed at that stack's env (SUPABASE_PUBLIC_URL/ANON_KEY/
# SERVICE_ROLE_KEY etc.) is all this file needs to reach it:
#
#   docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --build
#
# Sentry is intentionally not configured so staging errors don't pollute prod
# tracking.

name: presio-staging

services:
  presio-staging:
    container_name: presio-staging
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${ANON_KEY}
        # The deploying commit, so /healthz identifies exactly what is running
        # here. deploy-staging.yml sets this and then waits for that value to
        # appear before calling the deploy good.
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    networks:
      web:
    environment:
      SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      PORT: 3001
      # Both hostnames when dual-homed, or the second one's own requests are
      # refused as cross-origin.
      ALLOWED_ORIGIN: https://${STAGING_HOST:-staging.presio.xyz}${STAGING_HOST_ALT:+,https://${STAGING_HOST_ALT}}${STAGING_VIEWER_HOST:+,https://${STAGING_VIEWER_HOST}}${STAGING_VIEWER_HOST_ALT:+,https://${STAGING_VIEWER_HOST_ALT}}
      # Pin the origins used in generated links (canonical/og:url, handoff URLs)
      # instead of deriving them from the client-controlled Host header. Staging
      # sits behind Traefik on known hostnames, so the value is knowable here.
      # First entry wins for canonical/og:url; share links follow the request.
      PUBLIC_BASE_URLS: https://${STAGING_HOST:-staging.presio.xyz}${STAGING_HOST_ALT:+,https://${STAGING_HOST_ALT}}
      # Optional viewer hosts, paired with the two above (e.g.
      # staging-viewer.presio.xyz — one level under the domain, so the origin
      # certificate covers it). Unset = viewers stay on the staging hosts.
      VIEWER_BASE_URLS: ${STAGING_VIEWER_HOST:+https://${STAGING_VIEWER_HOST}}${STAGING_VIEWER_HOST_ALT:+,https://${STAGING_VIEWER_HOST_ALT}}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # Two OR'd matchers, not Host(`a`, `b`) — the multi-value form is Traefik
      # v2 syntax and v3 disables the router outright. STAGING_HOST_ALT is
      # optional and defaults back to the primary.
      - "traefik.http.routers.presio-staging.rule=Host(`${STAGING_HOST:-staging.presio.xyz}`) || Host(`${STAGING_HOST_ALT:-${STAGING_HOST:-staging.presio.xyz}}`) || Host(`${STAGING_VIEWER_HOST:-${STAGING_HOST:-staging.presio.xyz}}`) || Host(`${STAGING_VIEWER_HOST_ALT:-${STAGING_HOST:-staging.presio.xyz}}`)"
      - "traefik.http.routers.presio-staging.entrypoints=websecure"
      # Serve TLS from the proxy's certificates (Cloudflare Origin CA). Traefik
      # picks per-handshake by SNI: the default cert covers *.presio.xyz, and a
      # second one covers *.presio.ch when the alt host is under that domain.
      - "traefik.http.routers.presio-staging.tls=true"
      - "traefik.http.services.presio-staging.loadbalancer.server.port=3001"

networks:
  # Shared with the Traefik proxy (created once per host: `docker network create web`).
  web:
    external: true
