# Keeps the release pipeline's own inputs current — a self-hosted product ships
# whatever its build pulls in, so stale actions and dependencies are a supply
# chain concern rather than housekeeping. Grouped and monthly to keep the PR
# volume reviewable for a solo maintainer.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      client-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      server-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
