name: Deploy staging

# Deploys the `staging` branch to https://staging.presio.xyz, replacing the
# manual `docker compose -f docker-compose.staging.yml up -d --build` that used
# to be run on the host by hand.
#
# `staging` is a pointer at a known-good commit, not a place to develop:
# `promote-staging.yml` fast-forwards it to `main` after the test suite passes,
# and calls this workflow. Rolling back is therefore a git operation —
#
#   git push -f origin <older-sha>:staging
#
# — which lands here through the `push` trigger below and redeploys that commit.
#
# Host setup is the same as the PR previews (bare clone, deploy key, tailnet)
# — see the notes at the top of preview.yml. REPO_DIR and WORKTREE below are
# overridable via repo variables, same as preview.yml's REPO_DIR/PREVIEW_DIR.
# The one addition is the stack .env: docker-compose.staging.yml reuses the
# production Supabase stack, so it needs the same env file the production
# compose is run with. Override it with the STAGING_ENV_FILE repository
# variable if that ever moves.
#
# Staging used to be run by hand from a checkout at ~/projects/presio-staging-src.
# docker-compose.staging.yml pins `name: presio-staging`, so deploying from this
# workflow's own worktree manages those same containers; that directory can be
# removed once this has deployed successfully.

on:
  push:
    branches: [staging]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never let two deploys touch the same worktree at once; the newest wins.
  group: deploy-staging
  cancel-in-progress: false

env:
  # No default: an unset repo variable must fail the run loudly rather than
  # silently resolve to an empty string. Set REPO_DIR / STAGING_WORKTREE
  # under Settings → Secrets and variables → Actions → Variables.
  REPO_DIR: ${{ vars.REPO_DIR }}
  WORKTREE: ${{ vars.STAGING_WORKTREE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.presio.xyz
    steps:
      - name: Check required repo variables
        run: |
          missing=()
          [ -z "$REPO_DIR" ] && missing+=(REPO_DIR)
          [ -z "$WORKTREE" ] && missing+=(STAGING_WORKTREE)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo variables: ${missing[*]} — set them under Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: ./.github/actions/host-ssh
        with:
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ssh-key: ${{ secrets.PREVIEW_SSH_KEY }}
          ssh-host: ${{ secrets.PREVIEW_SSH_HOST }}
          hostname: presio-ci-${{ github.run_id }}

      - name: Deploy
        id: deploy
        env:
          SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
          SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
          ENV_FILE: ${{ vars.STAGING_ENV_FILE || '/home/administrator/projects/presio/.env' }}
        run: |
          set -euo pipefail
          # Variables expand locally; the heredoc is the remote script.
          # The delimiter is unquoted so $VARs above expand here, which also
          # means $(...) and backticks run ON THE RUNNER — escape them, and
          # keep backticks out of the comments below.
          #
          # The host reports the commit it actually deployed, rather than the
          # runner assuming its own checkout matches: if someone pushes to
          # staging between the promote and this step, what is running is the
          # host's answer, and that is what the verify step must wait for.
          ssh -o BatchMode=yes -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" bash -se <<EOF | tee /tmp/deploy.log
          set -euo pipefail

          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::stack env file not found at $ENV_FILE — set the STAGING_ENV_FILE repository variable to its real path"
            exit 1
          fi

          git -C "$REPO_DIR" fetch --force origin 'refs/heads/staging:refs/remotes/origin/staging'

          # Recreate the worktree each time rather than pulling into it: a
          # rollback moves the staging branch backwards, and a detached
          # re-add lands on the right commit whichever direction it moved.
          git -C "$REPO_DIR" worktree remove --force "$WORKTREE" 2>/dev/null || true
          git -C "$REPO_DIR" worktree prune
          # Belt-and-braces: a directory left behind by a crashed or
          # overlapping run (not a registered worktree, so the remove above
          # is a no-op) would otherwise make `add` fail with "already exists".
          rm -rf "$WORKTREE"
          git -C "$REPO_DIR" worktree add --detach "$WORKTREE" remotes/origin/staging

          cd "$WORKTREE"
          SHA=\$(git rev-parse --short HEAD)
          echo "DEPLOYED_VERSION=staging-\$SHA"
          # Baked into the image so /healthz reports the deployed commit, which
          # is what the verify step below waits for.
          APP_VERSION="staging-\$SHA" \
            docker compose --env-file "$ENV_FILE" -f docker-compose.staging.yml up -d --build --remove-orphans
          docker image prune -f >/dev/null
          EOF

          version=$(sed -n 's/^DEPLOYED_VERSION=//p' /tmp/deploy.log | tail -1)
          if [ -z "$version" ]; then
            echo "::error::the host did not report a deployed version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify
        env:
          HOST: https://staging.presio.xyz
          SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
          SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
          WANT: ${{ steps.deploy.outputs.version }}
        run: |
          set -euo pipefail
          # Checked on the host rather than over the public URL. The runner
          # cannot reach https://staging.presio.xyz — the origin admits only
          # Cloudflare, and something between the runner and the edge (bot
          # filtering on datacenter IPs is the likely candidate) eats the
          # request, while the same URL answers fine from a laptop and from the
          # host. The container's own answer is what "did the deploy work"
          # actually means, so ask it directly.
          #
          # Waits for the deployed commit specifically, not merely for a
          # response: a rebuild that failed while the previous container kept
          # running would otherwise pass.
          echo "waiting for $WANT"
          for i in $(seq 1 60); do
            got=$(ssh -o BatchMode=yes -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" \
              'docker exec presio-staging wget -qO- http://127.0.0.1:3001/healthz 2>/dev/null' \
              2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)
            if [ "$got" = "$WANT" ]; then
              echo "staging is serving $got"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::staging is serving '${got:-nothing}', expected '$WANT'"
              ssh -o BatchMode=yes -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" \
                'docker logs --tail 40 presio-staging 2>&1' || true
              exit 1
            fi
            sleep 5
          done

      # Separate from the gate above: this exercises Traefik and the Cloudflare
      # edge, which the deploy does not control and the runner may not be able
      # to reach at all. Worth reporting, never worth failing the deploy on.
      - name: Probe the public URL
        continue-on-error: true
        env:
          HOST: https://staging.presio.xyz
        run: |
          code=$(curl -s -o /tmp/probe -w '%{http_code}' --max-time 15 "$HOST/healthz" || echo "curl-failed")
          echo "HTTP $code"
          head -c 300 /tmp/probe 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "::warning::public probe returned '$code' — staging itself verified healthy on the host"
          fi
