<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; background: transparent; }
  [hidden] { display: none !important; }

  .card { box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px; color: var(--fg); }
  .card.light { --fg: #111; --muted: #6b7280; --border: #d4d4d8; --hover: #f4f4f5; }
  .card.dark { --fg: #f4f4f5; --muted: #a1a1aa; --border: #3f3f46; --hover: #27272a; }
  .elapsed { font: 600 24px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; transition: color .5s; }
  .clock { font: 14px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; color: var(--muted); }
  .row { display: flex; gap: 6px; }
  button { font: 500 13px/1 system-ui, -apple-system, sans-serif; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--fg); cursor: pointer; }
  button:hover { background: var(--hover); }
  button.outline { border-color: var(--border); }
</style>
</head>
<body>
<div class="card" id="card" hidden>
  <span class="elapsed" id="elapsed" data-testid="timer-elapsed"></span>
  <span class="clock" id="clock" data-testid="timer-clock" hidden></span>
  <div class="row">
    <button class="outline" id="startStop"></button>
    <button id="reset">Reset</button>
  </div>
</div>

<script>
  // One file, two surfaces, both on the presenter's device only:
  //  - tile: the dashboard card, with Start/Stop and Reset;
  //  - background: keeps the bottom-bar button's label on the current time and
  //    starts/stops the timer from it — the timer's handle on a phone, whose
  //    dashboard has no room for the card.
  // The clock itself lives in presio.storage, so it survives a reload and the
  // two surfaces always agree.
  const $ = (id) => document.getElementById(id);
  const STOPPED = { running: false, startedAt: null, accumulated: 0 };

  function clockState() {
    const c = presio.storage.get("clock");
    return c && typeof c.accumulated === "number" ? c : STOPPED;
  }

  function elapsedOf(c) {
    return c.running && c.startedAt ? c.accumulated + Math.floor((Date.now() - c.startedAt) / 1000) : c.accumulated;
  }

  function start() {
    const c = clockState();
    if (!c.running) presio.storage.set("clock", { ...c, running: true, startedAt: Date.now() });
    render();
  }

  function stop() {
    const c = clockState();
    if (c.running) presio.storage.set("clock", { running: false, startedAt: null, accumulated: elapsedOf(c) });
    render();
  }

  function reset() {
    presio.storage.set("clock", STOPPED);
    render();
  }

  const toSeconds = (minutes) => (minutes ? Math.round(minutes * 60) : 0);

  // What to display, and how far into the warning zone we are (0 = none,
  // ramping to 1 = fully overdue).
  function readout(elapsed) {
    const threshold = toSeconds(presio.settings.get("warningMinutes"));
    const duration = toSeconds(presio.settings.get("durationMinutes"));
    if (presio.settings.get("mode") === "down" && duration) {
      const remaining = Math.max(0, duration - elapsed);
      if (remaining === 0) return { seconds: 0, warning: 1 };
      if (threshold > 0 && remaining <= threshold) return { seconds: remaining, warning: 1 - remaining / threshold };
      return { seconds: remaining, warning: 0 };
    }
    if (threshold > 0 && elapsed >= threshold) {
      // Ramp to full red over the minute after the warning point.
      return { seconds: elapsed, warning: Math.min(1, (elapsed - threshold) / 60) };
    }
    return { seconds: elapsed, warning: 0 };
  }

  const pad = (n) => String(n).padStart(2, "0");
  function formatTime(total) {
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }

  function renderTile() {
    const c = clockState();
    const { seconds, warning } = readout(elapsedOf(c));
    $("card").className = "card " + presio.theme;
    $("elapsed").textContent = formatTime(seconds);
    $("elapsed").style.color = warning > 0 ? `hsl(${(1 - warning) * 30}, 90%, 50%)` : "";
    const showClock = presio.settings.get("showClock");
    $("clock").hidden = !showClock;
    if (showClock) {
      const now = new Date();
      $("clock").textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    $("startStop").textContent = c.running ? "Stop" : "Start";
  }

  let shown = "";
  function renderButton() {
    const c = clockState();
    const state = { label: formatTime(readout(elapsedOf(c)).seconds), active: c.running };
    // Ticks every second; only tell Presio when the button actually changes.
    if (JSON.stringify(state) === shown) return;
    shown = JSON.stringify(state);
    presio.ui.setButton("toggle", state);
  }

  const render = presio.surface === "tile" ? renderTile : renderButton;
  $("card").hidden = presio.surface !== "tile";

  if (presio.surface === "tile") {
    $("startStop").addEventListener("click", () => (clockState().running ? stop() : start()));
    $("reset").addEventListener("click", reset);
  } else {
    presio.onButton("toggle", () => (clockState().running ? stop() : start()));
  }

  presio.storage.onChange(render);
  presio.settings.onChange(render);
  presio.onContextChange(render);
  setInterval(render, 1000);
  render();
</script>
</body>
</html>
